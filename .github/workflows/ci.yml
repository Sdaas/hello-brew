name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install -e "apps/server[dev]"
          .venv/bin/pip install -e "apps/python-client"

      - name: Format check
        run: |
          .venv/bin/black --check apps/ tests/
          .venv/bin/ruff check apps/ tests/

      - name: Type check
        run: |
          .venv/bin/mypy apps/server/src apps/python-client/src

      - name: Unit tests
        run: .venv/bin/pytest tests/unit/ -v

      - name: Install jq (for shell client tests)
        run: brew install jq

      - name: Integration tests
        run: .venv/bin/pytest tests/integration/ -v
