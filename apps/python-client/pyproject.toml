[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-python-client"
version = "0.0.2"
description = "Demo Python client for demo-server"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
demo-python-client = "demo_python_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
