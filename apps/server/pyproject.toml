[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-server"
version = "0.0.3"
description = "Demo REST API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.136",
    "uvicorn~=0.46",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[project.scripts]
demo-server = "demo_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
